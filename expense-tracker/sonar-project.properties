# ============================================================
# SonarQube / SonarCloud Configuration
# Expense Tracker - Quality Gate & Static Analysis
# ============================================================

# ------------------------------------------------------------
# Project Identity
# ------------------------------------------------------------
sonar.projectKey=expense-tracker
sonar.organization=your-github-org
sonar.projectName=Expense Tracker
sonar.projectVersion=1.0

# ------------------------------------------------------------
# Source & Test Paths
# ------------------------------------------------------------
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.jsx,frontend/src/**/*.test.js,frontend/src/**/*.spec.jsx,frontend/src/**/*.spec.js

# ------------------------------------------------------------
# Language Configuration
# ------------------------------------------------------------
sonar.python.version=3.11
sonar.javascript.environments=browser
sonar.typescript.environments=browser

# ------------------------------------------------------------
# Exclusions (never scan these paths)
# ------------------------------------------------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/dist/**,\
  **/build/**,\
  **/migrations/**,\
  **/alembic/**,\
  **/*.min.js,\
  **/coverage/**

# ------------------------------------------------------------
# Coverage Reporting
# These paths are generated by CI before the SonarQube scan.
# Backend: pytest --cov=app --cov-report=xml:coverage.xml
# Frontend: npx vitest run --coverage (generates lcov.info)
# ------------------------------------------------------------
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ------------------------------------------------------------
# Quality Gate Thresholds (enforced server-side in SonarQube)
# Configure these in the SonarQube UI under Quality Gates.
# Recommended gates for this project:
#   - Coverage on new code         >= 80%
#   - Duplicated lines on new code <= 3%
#   - Maintainability rating       <= A
#   - Reliability rating           <= A
#   - Security rating              <= A
#   - Security Hotspots reviewed   = 100%
# ------------------------------------------------------------

# ------------------------------------------------------------
# Encoding & SCM
# ------------------------------------------------------------
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
